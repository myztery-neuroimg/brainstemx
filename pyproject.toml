[project]
name = "brainstemx"
version = "0.2.0"
description = "Intensity clustering pipeline for brain-stem MRI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "davidj-brewster", email = "david@myzteryeval.cc"}
]

# Core dependencies - required for basic pipeline functionality
dependencies = [
  "numpy>=1.28,<1.29",
  "scipy>=1.13",
  "pandas>=2.2",
  "nibabel>=5.3",
  "antspyx>=0.5.3",
  "scikit-image>=0.23",
  "matplotlib>=3.9",
  "joblib>=1.4"
]

# Optional dependency groups
[project.optional-dependencies]
# Web visualization dashboard (dash-based 3D MRI browser)
web = [
  "dash>=2.16",
  "dash-bootstrap-components>=1.5",
  "plotly>=5.20"
]
# AI-powered report generation (GPT-4 vision + DOCX export)
reports = [
  "openai>=1.5",
  "python-docx>=1.1.2"
]
# Fallback skull-stripping when ANTs fails
synthstrip = [
  "synthstrip>=1.0.0"
]
# Development tools
dev = [
  "pylint>=3.0.0",
  "pip-audit>=2.7.0"  # Security vulnerability scanning
]
# Install all optional features
all = [
  "dash>=2.16",
  "dash-bootstrap-components>=1.5",
  "plotly>=5.20",
  "openai>=1.5",
  "python-docx>=1.1.2",
  "synthstrip>=1.0.0",
  "pylint>=3.0.0",
  "pip-audit>=2.7.0"
]

[project.scripts]
brainstemx = "brainstemx.cli:main"

[build-system]
requires = ["uv>=0.1.32"]
build-backend = "uv.build"

